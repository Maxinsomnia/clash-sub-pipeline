# MetaFetch Configuration Template (Clash Meta)
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true
external-controller: 127.0.0.1:9090
# secret: "" # 外部控制器 API 访问密钥 (建议按需配置以防范本地跨源请求)

dns:
  enable: true
  listen: :1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 114.114.114.114
  fallback:
    - 8.8.8.8
    - 1.1.1.1

proxy-groups:
  - name: 🚀 选择代理
    type: select
    proxies:
      - ♻️ 自动选择
      - 🔰 延迟最低
      - ✅ 手动选择
      - 🗺️ 选择地区
      - DIRECT
      - 📢 订阅信息
  
  - name: 🗺️ 选择地区
    type: select
    proxies: [] # Will be filled with region groups

  - name: ♻️ 自动选择
    type: fallback
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    timeout: 3000
    lazy: true
    proxies: []

  - name: 🔰 延迟最低
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    timeout: 3000
    tolerance: 50
    lazy: true
    proxies: []
  
  - name: ✅ 手动选择
    type: select
    proxies: [] # Will be filled with all nodes

  - name: 🤖 AI 服务
    type: select
    proxies:
      - 🚀 选择代理
      - ♻️ 自动选择
      - 🔰 延迟最低
      - ✅ 手动选择

  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 📢 订阅信息
    type: select
    proxies: [] # Will be filled with info nodes

rules:
  # --- AI 服务优先走代理（来自 free-proxy-airport 的分流思路）---
  - DOMAIN-SUFFIX,openai.com,🤖 AI 服务
  - DOMAIN-SUFFIX,chatgpt.com,🤖 AI 服务
  - DOMAIN-SUFFIX,anthropic.com,🤖 AI 服务
  - DOMAIN-SUFFIX,claude.ai,🤖 AI 服务
  - DOMAIN-SUFFIX,gemini.google.com,🤖 AI 服务
  - DOMAIN-SUFFIX,cursor.com,🤖 AI 服务
  - DOMAIN-KEYWORD,openai,🤖 AI 服务
  - DOMAIN-KEYWORD,anthropic,🤖 AI 服务
  - DOMAIN-KEYWORD,claude,🤖 AI 服务
  - DOMAIN-KEYWORD,gemini,🤖 AI 服务

  # --- 广告拦截 ---
  - GEOSITE,category-ads-all,🛑 广告拦截

  - DOMAIN-SUFFIX,google.com,🚀 选择代理
  - DOMAIN-KEYWORD,google,🚀 选择代理
  - DOMAIN-SUFFIX,github.com,🚀 选择代理
  - DOMAIN-SUFFIX,githubusercontent.com,🚀 选择代理
  - DOMAIN-KEYWORD,github,🚀 选择代理
  - DOMAIN-SUFFIX,youtube.com,🚀 选择代理
  - DOMAIN-KEYWORD,youtube,🚀 选择代理
  - DOMAIN-SUFFIX,facebook.com,🚀 选择代理
  - DOMAIN-SUFFIX,twitter.com,🚀 选择代理
  - DOMAIN-SUFFIX,x.com,🚀 选择代理
  - DOMAIN-SUFFIX,netflix.com,🚀 选择代理
  - DOMAIN-SUFFIX,cn,DIRECT
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - MATCH,🚀 选择代理
